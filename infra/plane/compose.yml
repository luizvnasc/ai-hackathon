# Plane Community Edition — adapted from
# https://github.com/makeplane/plane/blob/v1.4.3/deployments/cli/community/docker-compose.yml
# Changes: configurable proxy port (no 443), secrets from .env, URLs pointing to localhost:PLANE_PORT.
# Service names (web, api, space, admin, live, plane-minio) are kept because the proxy (Caddy) depends on them.

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads

x-proxy-env: &proxy-env
  APP_DOMAIN: localhost
  FILE_SIZE_LIMIT: 5242880
  CERT_EMAIL: ""
  CERT_ACME_CA: https://acme-v02.api.letsencrypt.org/directory  # unused with SITE_ADDRESS=:80, but Caddyfile requires a value
  CERT_ACME_DNS: ""
  LISTEN_HTTP_PORT: 80
  LISTEN_HTTPS_PORT: 443
  BUCKET_NAME: uploads
  SITE_ADDRESS: ":80"

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-live-env: &live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?run make setup}

x-app-env: &app-env
  WEB_URL: http://localhost:${PLANE_PORT:-8090}
  CORS_ALLOWED_ORIGINS: http://localhost:${PLANE_PORT:-8090}
  DEBUG: 0
  GUNICORN_WORKERS: 1
  USE_MINIO: 1
  DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD:-plane}@plane-db/plane
  SECRET_KEY: ${SECRET_KEY:?run make setup}
  AMQP_URL: amqp://plane:${RABBITMQ_PASSWORD:-plane}@plane-mq:5672/plane
  # Generous so the metric collector can paginate the API without hitting 429
  API_KEY_RATE_LIMIT: 600/minute
  MINIO_ENDPOINT_SSL: 0
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?run make setup}
  # Allow Plane webhooks to containers on the local network
  WEBHOOK_ALLOWED_IPS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
  WEBHOOK_ALLOWED_HOSTS: ""

x-backend: &backend
  image: makeplane/plane-backend:${APP_RELEASE:-v1.4.3}
  restart: unless-stopped
  environment:
    <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]

services:
  web:
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.4.3}
    restart: unless-stopped
    depends_on: [api, worker]

  space:
    image: makeplane/plane-space:${APP_RELEASE:-v1.4.3}
    restart: unless-stopped
    depends_on: [api, worker, web]

  admin:
    image: makeplane/plane-admin:${APP_RELEASE:-v1.4.3}
    restart: unless-stopped
    depends_on: [api, web]

  live:
    image: makeplane/plane-live:${APP_RELEASE:-v1.4.3}
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on: [api, web]

  api:
    <<: *backend
    command: ./bin/docker-entrypoint-api.sh
    volumes: [plane-logs-api:/code/plane/logs]
    depends_on: [plane-db, plane-redis, plane-mq]

  worker:
    <<: *backend
    command: ./bin/docker-entrypoint-worker.sh
    volumes: [plane-logs-worker:/code/plane/logs]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  beat-worker:
    <<: *backend
    command: ./bin/docker-entrypoint-beat.sh
    volumes: [plane-logs-beat:/code/plane/logs]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  migrator:
    <<: *backend
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    volumes: [plane-logs-migrator:/code/plane/logs]
    depends_on: [plane-db, plane-redis]

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes: [plane-pgdata:/var/lib/postgresql/data]

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes: [plane-redisdata:/data]

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes: [plane-rabbitmq:/var/lib/rabbitmq]

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes: [plane-uploads:/export]

  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.4.3}
    container_name: plane-proxy
    restart: unless-stopped
    environment:
      <<: *proxy-env
    ports:
      - "${PLANE_PORT:-8090}:80"
    volumes:
      - plane-proxy-config:/config
      - plane-proxy-data:/data
    depends_on: [web, api, space, admin, live]

volumes:
  plane-pgdata:
  plane-redisdata:
  plane-uploads:
  plane-rabbitmq:
  plane-logs-api:
  plane-logs-worker:
  plane-logs-beat:
  plane-logs-migrator:
  plane-proxy-config:
  plane-proxy-data:
